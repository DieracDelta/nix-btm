[workspace]
resolver = "2"
members = [
    "crates/nix-analyticsd",
    "crates/nix-analytics-tui",
    "crates/nix-analytics-common",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
nix-analytics-common = { path = "crates/nix-analytics-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rmp-serde = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
nix = { version = "0.29", features = ["signal", "process", "user"] }
tempfile = "3"
